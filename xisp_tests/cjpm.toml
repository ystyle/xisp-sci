[package]
  cjc-version = "1.0.0"
  name = "xisp_tests"
  organization = "ystyle"
  description = "xisp-sci 契约 / 集成测试：只用 public API 验证数组行为（不发布）"
  version = "0.2.0"
  output-type = "static"
  compile-option = "-O2 -Woff unused"
  override-compile-option = ""
  link-option = ""
  include = ["/src"]
  license = ["MIT"]
  authors = ["ystyle"]
  repository = "https://gitcode.com/ystyle/xisp-sci"

[dependencies]
  "ystyle::xisp" = { path = "../../xisp/core" }
  "ystyle::xisp_array" = "0.2.0"
  "ystyle::xisp_io" = "0.2.0"
  "ystyle::xisp_stats" = "0.2.0"
  "ystyle::xisp_linalg" = "0.2.0"
  # 三后端（AST / 字节码 / JIT）差分：数组全部走 NativeFunc，理论上一致，
  # 但 `length` / `nth` 是 core 的通用内建，要确认它们在后端切换后仍走同一分派路径。
  "ystyle::xisp_bc" = { path = "../../xisp/xisp_bc" }
