[package]
  cjc-version = "1.0.0"
  name = "bench"
  organization = "ystyle"
  description = "xisp-sci 基准测试（不发布）：数据集冒烟、matmul 规模扫描、稀疏基线"
  version = "0.3.0"
  output-type = "executable"
  compile-option = "-O2 -Woff unused"
  override-compile-option = ""
  link-option = ""
  include = ["/src"]
  license = ["MIT"]
  authors = ["ystyle"]
  repository = "https://gitcode.com/ystyle/xisp-sci"

[dependencies]
  "ystyle::xisp" = "0.9.2"
  "ystyle::xisp_sci" = "0.3.0"
  # 直接构造 ndarray 注入解释器（Matrix Market 基准用）
  "ystyle::xisp_array" = "0.3.0"
