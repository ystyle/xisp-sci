[package]
  cjc-version = "1.0.0"
  name = "xisp_array"
  organization = "ystyle"
  description = "星枢科学计算地基：NDArray 的 dtype / shape / strides / 广播 / 视图"
  version = "0.6.0"
  output-type = "static"
  compile-option = "-O2 -Woff unused"
  override-compile-option = ""
  link-option = ""
  # 锚定到包根：未锚定的 `src` 会匹配任意层级的同名目录，把子目录内容一并打进制品
  include = ["/src"]
  license = ["MIT"]
  authors = ["ystyle"]
  repository = "https://gitcode.com/ystyle/xisp-sci"

[dependencies]
  # 开发期用 **path 依赖**指向同工作区的 xisp 源码：改 xisp 不必每次都发版，
  # 等数组模块稳定后再改回中心仓版本号统一发布（path 依赖不能发布，见 README）。
  "ystyle::xisp" = "0.9.3"
