name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          # 与本地开发环境一致（工作区规范：从 2026-10-10 起统一 1.2.0）。
          version: 1.2.0

      # 成员配置与版本一致性闸门。
      #
      # 工作区内的本地依赖解析不校验版本号（写错版本也能构建通过），所以 lockstep
      # 必须显式查。`scripts/check-members.sh` 覆盖得比 `cjpm ws check` 更全：
      # lockstep 版本、cjc-version 一致、test-dependencies 版本、制品范围、
      # 原生依赖白名单 —— 后三类是 `cjpm ws check` 管不到的，而它们只在发版时才爆，
      # 那时已经不可逆。
      #
      # 因此这里不再安装 cjpm-ws（0.1.6 的 cjpm.toml 缺 stdx.compress.zlib 依赖，
      # `cjpm install` 会失败；CI 也不需要它的 publish/bump 能力）。
      - name: Member config and version gate
        run: bash scripts/check-members.sh

      - name: Build
        run: cjpm build

      - name: Test
        run: cjpm test --no-progress
