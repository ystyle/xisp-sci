[package]
  cjc-version = "1.0.0"
  name = "xisp_sci"
  organization = "ystyle"
  description = "星枢科学计算门面：一次装齐全族能力（数组 / IO / 统计 / 线代 / 信号 / 数值）"
  version = "0.3.1"
  output-type = "static"
  compile-option = "-O2 -Woff unused"
  override-compile-option = ""
  link-option = ""
  include = ["/src"]
  license = ["MIT"]
  authors = ["ystyle"]
  repository = "https://gitcode.com/ystyle/xisp-sci"

[dependencies]
  "ystyle::xisp" = "0.9.2"
  "ystyle::xisp_array" = "0.3.1"
  "ystyle::xisp_io" = "0.3.1"
  "ystyle::xisp_stats" = "0.3.1"
  "ystyle::xisp_linalg" = "0.3.1"
  "ystyle::xisp_signal" = "0.3.1"
  "ystyle::xisp_num" = "0.3.1"
