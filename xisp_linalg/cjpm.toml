  include = ["/src"]
  license = ["MIT"]
  authors = ["ystyle"]
  repository = "https://gitcode.com/ystyle/xisp-sci"

[dependencies]
  "ystyle::xisp" = "0.9.2"
  "ystyle::xisp_array" = "0.3.0"
