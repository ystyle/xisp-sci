[package]
  cjc-version = "1.0.0"
  name = "xisp_linalg"
  organization = "ystyle"
  description = "星枢科学计算线性代数：矩阵乘法、LU / QR / Cholesky 分解、解方程与特征值"
  version = "0.3.0"
  output-type = "static"
  compile-option = "-O2 -Woff unused"
